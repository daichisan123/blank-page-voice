<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)">
  <title>Blank Page</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="list-view" class="view">
    <header class="bar">
      <h1>Blank Page</h1>
      <button id="open-settings" class="icon" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      </button>
    </header>
    <div class="sync" hidden></div>
    <ul id="notes"></ul>
    <p id="empty" hidden>No notes yet.</p>
    <button id="new-note" class="primary">New note</button>
  </section>

  <section id="note-view" class="view" hidden>
    <header class="bar">
      <button id="back" class="icon" aria-label="Back to notes">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="spacer"></span>
      <button id="copy" class="text">Copy</button>
      <button id="delete" class="icon danger" aria-label="Delete note">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>
      </button>
    </header>
    <div class="sync" hidden></div>
    <textarea id="body" spellcheck="true" placeholder="Record or type below."></textarea>
    <div id="pending" hidden></div>
    <footer id="composer">
      <p id="status" hidden></p>
      <div class="row">
        <textarea id="draft" rows="1" enterkeyhint="send" placeholder="Tap the mic to talk"></textarea>
        <button id="mic" aria-label="Record">
          <svg class="mic-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <span class="stop-icon"></span>
        </button>
        <button id="enter" aria-label="Add to note">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </footer>
  </section>

  <section id="settings-view" class="view" hidden>
    <header class="bar">
      <button id="settings-back" class="icon" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1>Settings</h1>
    </header>
    <div class="settings">
      <label for="key">Groq API key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_…">
      <p class="hint">Used only to turn speech into text. It stays on this phone.</p>
      <button id="save-key" class="primary">Save key</button>
      <p id="key-status" class="hint"></p>

      <label for="client-id" class="gap">Google Drive</label>
      <p class="hint">Paste the Client ID from Google's console. Notes then save into your Blank Page folder in Drive, which syncs to the laptop.</p>
      <input id="client-id" type="text" autocomplete="off" spellcheck="false" placeholder="….apps.googleusercontent.com">
      <button id="connect" class="primary">Connect Google Drive</button>
      <p id="drive-status" class="hint"></p>
    </div>
  </section>

  <script src="drive.js"></script>
  <script src="app.js"></script>
</body>
</html>
